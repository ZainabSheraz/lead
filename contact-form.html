<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us</title>
<style>
  :root { --bg:#f5f7fa; --ink:#14213d; --muted:#5b6678; --line:#d3d9e3; --accent:#0e7c7b; --accent-ink:#ffffff; --err:#b3261e; --card:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1624; --ink:#e8edf6; --muted:#9aa6bb; --line:#2a3550; --accent:#3cc3bf; --accent-ink:#0f1624; --err:#ff8a80; --card:#17203a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width:100%; max-width:480px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:32px; }
  h1 { margin:0 0 4px; font-size:1.6rem; letter-spacing:-0.01em; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  label { display:block; margin:16px 0 6px; font-weight:600; font-size:.95rem; }
  input, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); font:inherit; }
  textarea { min-height:130px; resize:vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button { margin-top:24px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #status { margin-top:16px; min-height:1.5em; font-weight:600; }
  #status.ok { color:var(--accent); }
  #status.err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>Tell us what you need</h1>
  <p class="sub">We reply by email within a few minutes.</p>
  <form id="f" novalidate>
    <label for="name">Name</label>
    <input id="name" name="name" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>
    <button id="btn" type="submit">Send message</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
  // Production URL works after you click Publish in n8n.
  // For a one-off test, swap in the /webhook-test/ URL and click "Execute workflow" first.
  const WEBHOOK_URL = "https://zainabsh.app.n8n.cloud/webhook/lead-intake";

  const form = document.getElementById("f");
  const btn = document.getElementById("btn");
  const statusEl = document.getElementById("status");

  function show(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ""; }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = {
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      message: form.message.value.trim()
    };
    if (!data.name || !data.email || !data.message) { show("Fill in your name, email and message.", "err"); return; }
    btn.disabled = true;
    show("Sending...");
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error("Server answered " + res.status);
      show("Message sent. Check your inbox for our reply.", "ok");
      form.reset();
    } catch (err) {
      show("Could not send: " + err.message + ". Check the webhook URL and CORS setting.", "err");
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
